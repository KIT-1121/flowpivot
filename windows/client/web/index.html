<!doctype html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>流枢 FlowPivot</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="client.css">
  <script src="visuals.js" defer></script>
  <script src="client.js" defer></script>
</head>
<body>
  <div id="icons" hidden aria-hidden="true"></div>
  <div class="shell">
    <aside class="side">
      <button type="button" class="brand" aria-label="流枢 首页">
        <span class="mark"><svg width="27" height="27" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 8h9l7 8h6M5 16h22M5 24h9l7-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m23 12 4 4-4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><strong>流枢</strong></span>
      </button>
      <nav id="nav" aria-label="工作台"></nav>
      <section class="side-bottom traffic" id="traffic" data-status="offline" aria-label="连接状态与流量">
        <div class="traffic-head">
          <div class="traffic-state" role="status"><i class="dot" aria-hidden="true"></i><strong id="traffic-state">未连接</strong></div>

        </div>
        <table class="traffic-table" aria-label="实时网速与本次打开累计流量">
          <thead><tr><td></td><th scope="col">↓ 下载</th><th scope="col">↑ 上传</th></tr></thead>
          <tbody>
            <tr><th scope="row">网速</th><td id="traffic-download">0 KB/s</td><td id="traffic-upload">0 KB/s</td></tr>
            <tr><th scope="row">流量</th><td id="traffic-down-total">0 B</td><td id="traffic-up-total">0 B</td></tr>
          </tbody>
        </table>
      </section>
    </aside>
    <div class="work">
      <main id="page" aria-label="页面内容"></main>
      <div id="pointer-glow" aria-hidden="true"></div>
    </div>
  </div>
  <dialog id="update-dialog" aria-labelledby="update-title"><div class="dialog-body"><h2 id="update-title">发现新版本</h2><p id="update-description"></p><p>将在浏览器中下载新版。安装或替换前请退出流枢。</p><p id="update-error" role="alert" hidden></p><div class="dialog-foot"><button type="button" class="button" data-act="app-later" autofocus>暂不更新</button><button type="button" class="button primary" data-act="app-download">更新</button></div></div></dialog>
  <dialog id="editor" aria-labelledby="editor-title"><form class="dialog-body" id="editor-form"><h2 id="editor-title"></h2><label for="editor-input" id="editor-label"></label><input class="field" id="editor-input" autocomplete="off" required><div class="dialog-foot"><button type="button" class="button" data-act="cancel">取消</button><button type="submit" class="button primary">确定</button></div></form></dialog>
  <div id="source-menu" role="menu" aria-label="订阅操作" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
